<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Monitor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="top-left">
      <button id="toggle-sidebar" class="btn" aria-controls="sessions">Hide sessions</button>
      <span class="brand">Claude Monitor</span>
    </div>
    <div class="top-right">
      <button id="notify" class="btn" aria-pressed="false">Notifications off</button>
      <span id="conn" class="conn">Connecting…</span>
    </div>
  </header>
  <div class="layout">
    <nav id="sessions" class="sessions" aria-label="Sessions"></nav>
    <main id="detail" class="detail"></main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
