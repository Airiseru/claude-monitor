<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Monitor</title>
  <link rel="stylesheet" href="/style.css">
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <header class="top">
    <div class="top-left">
      <button id="toggle-sidebar" class="btn" aria-controls="sidebar">Hide sessions</button>
      <span class="brand">Claude Monitor</span>
    </div>
    <div class="top-right">
      <div id="limits" class="limits" role="group" aria-label="Your plan’s usage limits"></div>
      <button id="notify" class="btn" aria-pressed="false">Notifications off</button>
      <span id="conn" class="conn">Connecting…</span>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <!-- Outside the list, which redraws on every update, so typing here isn't interrupted. -->
      <div class="sidebar-tools">
        <button id="new-session" class="btn new-session">+ New session</button>
        <input id="search" class="input" type="search" placeholder="Search titles, folders, prompts, replies" aria-label="Search sessions">
        <span class="select-wrap"><select id="project" class="input" aria-label="Filter by project"><option value="">All projects</option></select></span>
        <div class="group-by" role="group" aria-label="Group sessions by">
          <span class="muted">Group by</span>
          <button type="button" class="seg" data-group="status" aria-pressed="true">Status</button>
          <button type="button" class="seg" data-group="project" aria-pressed="false">Project</button>
        </div>
        <p class="keys muted">Keys: <kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>a</kbd> allow · <kbd>d</kbd> deny · <kbd>n</kbd> new · <kbd>w</kbd> Warp</p>
      </div>
      <nav id="sessions" class="sessions" aria-label="Sessions"></nav>
    </aside>
    <main id="detail" class="detail">
      <div id="detail-content"></div>
      <!-- Built once and only shown/hidden, so what you type survives live updates. -->
      <form id="composer" class="composer" hidden>
        <p id="composer-note" class="hint"></p>
        <textarea id="composer-text" rows="3" placeholder="Reply to Claude…  (⌘/Ctrl + Enter to send)" aria-label="Message to Claude"></textarea>
        <div class="composer-actions">
          <span id="composer-status" class="hint" role="status"></span>
          <button type="button" id="composer-stop" class="btn">Stop</button>
          <button type="button" id="composer-end" class="btn">End session</button>
          <button type="submit" id="composer-send" class="btn allow">Send</button>
        </div>
      </form>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
