# tmux settings for Claude Code sessions run by Claude Monitor (its own tmux server, socket
# "claude-monitor", so your own tmux setup is untouched). Read when that server starts.

# Scroll with the mouse or trackpad, and keep plenty of history.
set -g mouse on
set -g history-limit 50000
# Esc reaches Claude Code at once (it interrupts a turn); tmux's default waits half a second.
set -g escape-time 10
# Shift+Enter (a new line in Claude Code's prompt) and focus tracking pass through to Claude Code.
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
# Colours as in your terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# A quiet status line: which session this is, and how to leave without stopping it.
set -g status-style "fg=colour245,bg=default"
set -g status-left "#[bold]#S#[nobold]  "
set -g status-left-length 40
set -g status-right "Ctrl-b d: detach (Claude keeps running)"
set -g status-right-length 60
set -g window-status-format ""
set -g window-status-current-format ""
